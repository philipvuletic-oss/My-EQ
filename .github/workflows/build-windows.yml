name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build VST3
        run: cargo xtask bundle my_eq --release
      - uses: actions/upload-artifact@v4
        with:
          name: my_eq-windows
          path: target/bundled
